name: Cross-platform CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-source-policy:
    name: Open-source policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check npm dependency licenses
        run: npm run check:licenses:npm

      - name: Check npm security advisories
        run: npm run check:advisories:npm

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install pinned cargo-about
        uses: taiki-e/install-action@v2.86.1
        with:
          tool: cargo-about@0.9.1
          fallback: none

      - name: Fetch locked Rust dependencies for offline attribution
        run: cargo fetch --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Verify generated third-party attributions are current
        run: |
          npm run generate:licenses
          git diff --exit-code -- THIRD_PARTY_LICENSES_NPM.txt THIRD_PARTY_LICENSES_RUST.html

      - name: Check Cargo advisories, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          arguments: --all-features
          command: check advisories licenses sources

  test-and-build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    env:
      CARGO_TERM_COLOR: always
      PLAYWRIGHT_BROWSER_CHANNEL: chrome

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Make Git Bash visible to Windows contract tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Type-check workspaces
        run: npm run typecheck

      - name: Run JavaScript and contract tests
        run: npm test

      - name: Build renderer
        run: npm run check:renderer

      - name: Run renderer and accessibility tests
        run: npm run check:ui

      - name: Check Rust targets
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets

      - name: Run Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Build native application without bundling
        working-directory: apps/desktop
        run: npx tauri build --no-bundle
