[package]
name = "paper-float-translator-desktop"
version = "0.1.0"
description = "Paper Float Translator desktop app"
authors = ["Paper Float Translator"]
edition = "2021"

[lib]
name = "paper_float_translator_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "paper-float-translator"
path = "src/main.rs"

[features]
default = []
# Compiles deterministic native fault injection and exposes the otherwise
# hidden fixed acceptance runner. Never enable this feature for release builds.
acceptance-testing = []
# Local/ad-hoc macOS builds cannot obtain a stable Keychain code-signing
# partition identity. This feature keeps those builds off the login Keychain
# entirely and stores the API key in a mode-0600 app-data file instead.
local-api-key-file = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
dirs = "5"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
