[package]
name = "paper-float-translator-desktop"
version = "0.1.1"
description = "Paper Float Translator desktop app"
authors = ["Jinke Lin", "Paper Float Translator contributors"]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/jklinkj/paper-float-translator"
homepage = "https://github.com/jklinkj/paper-float-translator"
readme = "../../../README.md"
publish = false

[lib]
name = "paper_float_translator_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "paper-float-translator"
path = "src/main.rs"

[features]
default = []
# Compiles deterministic native fault injection and exposes the otherwise
# hidden fixed acceptance runner. Never enable this feature for release builds.
acceptance-testing = []
# Local/ad-hoc macOS builds cannot obtain a stable Keychain code-signing
# partition identity. This feature keeps those builds off the login Keychain
# entirely and stores the API key in a mode-0600 app-data file instead.
local-api-key-file = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
atomic-write-file = "0.3"
dirs = "5"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
keyring-core = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
uiautomation = { version = "0.25", features = ["event"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-native-keyring-store = { version = "1", default-features = false }
